<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Bar — Cruscotto Progetti Web</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg: #1b1d21;
  --bg-seam: #17181b;
  --panel: #24262b;
  --panel-border: #35383e;
  --panel-highlight: #3d4046;
  --text: #f2efe4;
  --text-muted: #9a9ea6;
  --text-faint: #5d6167;
  --led-green: #5fd38d;
  --led-amber: #e8a94a;
  --led-red: #e2645a;
  --brass: #c2a468;
  --brass-dim: #8d7a51;
  --radius: 10px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}

body{
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
    radial-gradient(ellipse at top, #24262b 0%, var(--bg) 55%);
  color:var(--text);
  font-family:'IBM Plex Mono', monospace;
  min-height:100vh;
  padding:0 0 80px 0;
}

.eyebrow{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:11px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--brass);
}

.logo-mark{
  display:inline-flex;
  align-items:baseline;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:26px;
  letter-spacing:.005em;
  color:var(--text);
  text-transform:lowercase;
  margin-bottom:2px;
}
.logo-mark .i-letter{
  position:relative;
  display:inline-block;
}
.logo-mark .i-letter::before{
  content:"";
  position:absolute;
  top:-1px;
  left:50%;
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--brass);
  transform:translateX(-50%);
}

header{
  max-width:1180px;
  margin:0 auto;
  padding:52px 28px 30px;
  border-bottom:1px solid var(--panel-border);
}

header .plate{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:20px;
}

h1{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:clamp(30px,5vw,46px);
  letter-spacing:.01em;
  text-transform:uppercase;
  margin:8px 0 6px;
  color:var(--text);
}

header p{
  color:var(--text-muted);
  font-size:13px;
  max-width:480px;
  line-height:1.6;
  margin:0;
}

.readout{
  display:flex;
  gap:22px;
  font-size:11px;
  color:var(--text-faint);
  letter-spacing:.05em;
}
.readout span b{color:var(--led-green);font-weight:600;}

/* toolbar */
.toolbar{
  max-width:1180px;
  margin:26px auto 0;
  padding:0 28px;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
}

.switchbank{
  display:flex;
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:8px;
  padding:4px;
  gap:2px;
}
.switchbank button{
  font-family:'Oswald',sans-serif;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  font-weight:600;
  color:var(--text-muted);
  background:transparent;
  border:none;
  padding:9px 16px;
  border-radius:5px;
  cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
.switchbank button.active{
  background:var(--panel-highlight);
  color:var(--text);
  box-shadow:inset 0 0 0 1px var(--brass-dim);
}
.switchbank button:hover{color:var(--text);}

.manage-btn{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--text-muted);
  background:transparent;
  border:1px solid var(--panel-border);
  border-radius:8px;
  padding:11px 16px;
  cursor:pointer;
}
.manage-btn:hover{color:var(--text);border-color:var(--brass-dim);}

.add-btn{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:#1b1d21;
  background:linear-gradient(180deg,#d4b87e,var(--brass));
  border:1px solid var(--brass-dim);
  border-radius:8px;
  padding:11px 18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 6px 14px -8px rgba(0,0,0,.6);
}
.add-btn:hover{filter:brightness(1.06);}
.add-btn:active{transform:translateY(1px);}

/* grid */
.grid{
  max-width:1180px;
  margin:26px auto 0;
  padding:0 28px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:16px;
}

.card{
  position:relative;
  background:linear-gradient(180deg,#26282d,#212327);
  border:1px solid var(--panel-border);
  border-radius:var(--radius);
  padding:18px 18px 16px;
  min-height:168px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:border-color .2s ease, transform .2s ease;
}
.card:hover{border-color:var(--panel-highlight);}

.card::before,.card::after{
  content:"";
  position:absolute;
  width:5px;height:5px;
  border-radius:50%;
  background:#111214;
  box-shadow:0 0 0 1px rgba(255,255,255,.05), inset 0 1px 1px rgba(0,0,0,.6);
  top:9px;
}
.card::before{left:9px;}
.card::after{right:9px;}

.card-top{display:flex;align-items:center;justify-content:space-between;}

.led-row{display:flex;align-items:center;gap:7px;}
.led{
  width:8px;height:8px;border-radius:50%;
  background:var(--led-green);
  box-shadow:0 0 6px 1px var(--led-green);
  animation:breathe 3.4s ease-in-out infinite;
}
.led.amber{background:var(--led-amber);box-shadow:0 0 6px 1px var(--led-amber);}
.led.red{background:var(--led-red);box-shadow:0 0 6px 1px var(--led-red);}
@keyframes breathe{0%,100%{opacity:1;}50%{opacity:.45;}}

.cat-label{
  font-family:'Oswald',sans-serif;
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--text-faint);
}

.card-actions{display:flex;gap:6px;opacity:0;transition:opacity .15s ease;}
.card:hover .card-actions{opacity:1;}
.icon-btn{
  width:22px;height:22px;
  border-radius:5px;
  border:1px solid var(--panel-border);
  background:#1d1f23;
  color:var(--text-faint);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  padding:0;
}
.icon-btn:hover{color:var(--text);border-color:var(--brass-dim);}
.icon-btn svg{width:12px;height:12px;}

.card-title{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:19px;
  letter-spacing:.01em;
  color:var(--text);
  margin:14px 0 4px;
  line-height:1.15;
}

.card-url{
  font-size:11px;
  color:var(--text-faint);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  margin-bottom:14px;
}

/* whole card is the launch control */
.card{cursor:pointer;}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 22px -14px rgba(0,0,0,.7);}
.card:active{transform:translateY(0);}

.launch-hint{
  align-self:flex-start;
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--text-faint);
  font-family:'Oswald',sans-serif;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.launch-hint svg{width:11px;height:11px;transition:transform .15s ease;}
.card:hover .launch-hint{color:var(--brass);}
.card:hover .launch-hint svg{transform:translate(2px,-2px);}

/* add-slot card */
.add-slot{
  border:1px dashed var(--panel-border);
  border-radius:var(--radius);
  min-height:168px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:var(--text-faint);
  cursor:pointer;
  background:transparent;
  font-family:'Oswald',sans-serif;
  letter-spacing:.1em;
  text-transform:uppercase;
  font-size:11px;
}
.add-slot:hover{border-color:var(--brass-dim);color:var(--text-muted);}
.add-slot .plus{
  font-family:'IBM Plex Mono',monospace;
  font-size:22px;
  line-height:1;
  color:var(--text-faint);
}
.add-slot:hover .plus{color:var(--brass);}

.empty-msg{
  grid-column:1/-1;
  text-align:center;
  color:var(--text-faint);
  font-size:12px;
  padding:30px 0;
}

/* modal */
.overlay{
  position:fixed;inset:0;
  background:rgba(10,10,11,.72);
  display:none;
  align-items:center;justify-content:center;
  z-index:50;
  padding:20px;
}
.overlay.open{display:flex;}
.modal{
  width:100%;max-width:380px;
  background:linear-gradient(180deg,#26282d,#212327);
  border:1px solid var(--panel-border);
  border-radius:12px;
  padding:24px;
  position:relative;
}
.modal::before,.modal::after{
  content:"";position:absolute;width:6px;height:6px;border-radius:50%;
  background:#111214;box-shadow:0 0 0 1px rgba(255,255,255,.05);
  top:12px;
}
.modal::before{left:12px;}
.modal::after{right:12px;}

.modal h2{
  font-family:'Oswald',sans-serif;
  font-size:16px;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin:4px 0 18px;
  color:var(--text);
}

.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--text-faint);
  margin-bottom:6px;
  font-family:'Oswald',sans-serif;
}
.field input,.field select{
  width:100%;
  background:#16171a;
  border:1px solid var(--panel-border);
  border-radius:6px;
  padding:10px 11px;
  color:var(--text);
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  outline:none;
}
.field input:focus,.field select:focus{border-color:var(--brass-dim);}

.cat-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}
.cat-row input{
  flex:1;
  background:#16171a;
  border:1px solid var(--panel-border);
  border-radius:6px;
  padding:8px 10px;
  color:var(--text);
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  outline:none;
}
.cat-row input:focus{border-color:var(--brass-dim);}
.cat-row .icon-btn{flex-shrink:0;width:26px;height:26px;}
.cat-row .icon-btn svg{width:13px;height:13px;}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}
.modal-actions button{
  flex:1;
  padding:11px;
  border-radius:7px;
  font-family:'Oswald',sans-serif;
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  cursor:pointer;
}
.btn-cancel{background:transparent;border:1px solid var(--panel-border);color:var(--text-muted);}
.btn-cancel:hover{color:var(--text);}
.btn-save{background:linear-gradient(180deg,#d4b87e,var(--brass));border:1px solid var(--brass-dim);color:#1b1d21;font-weight:600;}
.btn-save:hover{filter:brightness(1.06);}

.logo-mark.small{
  font-size:13px;
  color:var(--text-faint);
}
.logo-mark.small .i-letter::before{
  width:3px;height:3px;
  top:-1px;
}

.logo-img{
  display:block;
  height:30px;
  width:auto;
  margin-bottom:10px;
}
.logo-img.small{
  height:15px;
  margin-bottom:0;
}

footer{
  max-width:1180px;
  margin:50px auto 0;
  padding:20px 28px 0;
  border-top:1px solid var(--panel-border);
  color:var(--text-faint);
  font-size:11px;
  letter-spacing:.05em;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}

@media (max-width:480px){
  header{padding:36px 18px 24px;}
  .toolbar,.grid,footer{padding-left:18px;padding-right:18px;}
}
</style>
</head>

</div>

<div class="overlay" id="catOverlay">
  <div class="modal">
    <h2>Categorie</h2>
    <div id="catList"></div>
    <div class="field" style="margin-top:16px;">
      <label for="newCatName">Nuova categoria</label>
      <input type="text" id="newCatName" placeholder="es. Fornitori">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" id="closeCatModal">Chiudi</button>
      <button type="button" class="btn-save" id="addCatBtn">Aggiungi</button>
    </div>
  </div>
</div>

<script>
/* ====== CONFIGURAZIONE ARCHIVIAZIONE CONDIVISA (JSONBin.io) ======
   1) Crea un account gratuito su https://jsonbin.io
   2) In "API Keys" crea una chiave e copiala qui sotto in JSONBIN_API_KEY
   3) Crea un nuovo Bin con questo contenuto iniziale:
      {"sites":[],"categories":["Family Bar","Altri progetti"]}
      e copia l'ID del bin qui sotto in JSONBIN_BIN_ID
   Finché questi due valori restano quelli di default, il cruscotto
   funziona comunque, ma salva solo nel browser di chi lo usa. */
const JSONBIN_BIN_ID = '6a79a6bef5f4af5e2901d3b3';
const JSONBIN_API_KEY = '$2a$10$uqWos2c7xu8vAker.l9/Me2ps0YENO6e.9V3WCgpfClCcfE4dq8lO';
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
const REMOTE_CONFIGURED = !JSONBIN_BIN_ID.startsWith('INSERISCI') && !JSONBIN_API_KEY.startsWith('INSERISCI');

const LOCAL_FALLBACK_KEY = 'familybar-cruscotto-dati-v1';

const defaultSites = [
  { id:'fb-webapp', name:'Family Bar Webapp', url:'https://familybar-webapp.vercel.app/', category:'Family Bar' },
  { id:'food-waste', name:'Food Waste Analytics', url:'https://food-waste-analytics.vercel.app/', category:'Family Bar' }
];
const defaultCategories = ['Family Bar', 'Altri progetti'];
const ledCycle = ['', 'amber', 'red'];

function loadLocalFallback(){
  const raw = localStorage.getItem(LOCAL_FALLBACK_KEY);
  if(!raw) return { sites:[...defaultSites], categories:[...defaultCategories] };
  try{
    const parsed = JSON.parse(raw);
    return {
      sites: Array.isArray(parsed.sites) ? parsed.sites : [...defaultSites],
      categories: (Array.isArray(parsed.categories) && parsed.categories.length) ? parsed.categories : [...defaultCategories]
    };
  }catch(e){ return { sites:[...defaultSites], categories:[...defaultCategories] }; }
}
function saveLocalFallback(){
  localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify({ sites, categories }));
}

function showConfigBanner(message){
  let banner = document.getElementById('configBanner');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'configBanner';
    banner.style.cssText = 'max-width:1180px;margin:0 auto;padding:12px 28px;color:var(--led-amber);font-size:12px;letter-spacing:.03em;';
    document.querySelector('.toolbar').insertAdjacentElement('afterend', banner);
  }
  banner.textContent = message;
}

async function loadData(){
  if(!REMOTE_CONFIGURED){
    const local = loadLocalFallback();
    sites = local.sites;
    categories = local.categories;
    showConfigBanner('⚠ Archiviazione condivisa non configurata: i dati si salvano solo su questo browser. Vedi le istruzioni nel codice del file.');
    return;
  }
  try{
    const res = await fetch(JSONBIN_URL + '/latest', { headers: { 'X-Master-Key': JSONBIN_API_KEY } });
    if(!res.ok) throw new Error('risposta non valida');
    const json = await res.json();
    const record = json.record || {};
    sites = Array.isArray(record.sites) ? record.sites : [...defaultSites];
    categories = (Array.isArray(record.categories) && record.categories.length) ? record.categories : [...defaultCategories];
  }catch(e){
    console.error(e);
    const local = loadLocalFallback();
    sites = local.sites;
    categories = local.categories;
    showConfigBanner('⚠ Impossibile raggiungere l\'archivio condiviso: mostrati i dati salvati su questo browser.');
  }
}

async function saveData(){
  saveLocalFallback();
  if(!REMOTE_CONFIGURED) return;
  try{
    const res = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
      body: JSON.stringify({ sites, categories })
    });
    if(!res.ok) throw new Error('salvataggio fallito');
  }catch(e){
    console.error(e);
    alert('Non sono riuscito a salvare online. La modifica resta solo su questo browser finché la connessione non torna disponibile.');
  }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

let sites = [];
let categories = [];
let activeFilter = 'tutti';
let editingId = null;

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const catOverlay = document.getElementById('catOverlay');
const form = document.getElementById('siteForm');
const modalTitle = document.getElementById('modalTitle');

function hostname(url){
  try{ return new URL(url).hostname.replace('www.',''); }catch(e){ return url; }
}

function ledClassFor(category){
  const idx = categories.indexOf(category);
  if(idx < 0) return '';
  return ledCycle[idx % ledCycle.length];
}

function renderFilterBank(){
  const bank = document.getElementById('filterBank');
  const all = `<button class="${activeFilter === 'tutti' ? 'active' : ''}" data-filter="tutti">Tutti</button>`;
  const cats = categories.map(c => `<button class="${activeFilter === c ? 'active' : ''}" data-filter="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
  bank.innerHTML = all + cats;
}

function renderCategoryOptions(selected){
  const sel = document.getElementById('fCat');
  sel.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}" ${c === selected ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');
}

function render(){
  grid.innerHTML = '';
  const visible = sites.filter(s => activeFilter === 'tutti' || s.category === activeFilter);
  document.getElementById('countActive').textContent = sites.length;

  visible.forEach(site => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.action = 'open';
    card.dataset.id = site.id;
    card.innerHTML = `
      <div class="card-top">
        <div class="led-row">
          <div class="led ${ledClassFor(site.category)}"></div>
          <span class="cat-label">${escapeHtml(site.category)}</span>
        </div>
        <div class="card-actions">
          <button class="icon-btn" data-action="edit" data-id="${site.id}" title="Modifica">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="icon-btn" data-action="delete" data-id="${site.id}" title="Rimuovi">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>
      <div>
        <div class="card-title">${escapeHtml(site.name)}</div>
        <div class="card-url">${escapeHtml(hostname(site.url))}</div>
      </div>
      <div class="launch-hint">
        Apri <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
      </div>
    `;
    grid.appendChild(card);
  });

  const addSlot = document.createElement('div');
  addSlot.className = 'add-slot';
  addSlot.id = 'addSlotBtn';
  addSlot.innerHTML = `<div class="plus">+</div><div>Aggiungi progetto</div>`;
  grid.appendChild(addSlot);

  if(visible.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = 'Nessun sito in questa categoria.';
    grid.insertBefore(empty, addSlot);
  }
}

grid.addEventListener('click', async (e) => {
  // le icone di modifica/rimozione hanno priorità e non devono aprire il link
  const iconBtn = e.target.closest('.icon-btn');
  if(iconBtn){
    e.stopPropagation();
    const id = iconBtn.dataset.id;
    const action = iconBtn.dataset.action;
    const site = sites.find(s => s.id === id);
    if(action === 'edit' && site){
      openModal(site);
    } else if(action === 'delete' && site){
      if(confirm(`Rimuovere "${site.name}" dal cruscotto?`)){
        sites = sites.filter(s => s.id !== id);
        render();
        await saveData();
      }
    }
    return;
  }
  // click ovunque sulla scheda apre il progetto in una finestra separata
  const card = e.target.closest('.card[data-action="open"]');
  if(card){
    const site = sites.find(s => s.id === card.dataset.id);
    if(site) window.open(site.url, '_blank', 'noopener');
    return;
  }
  if(e.target.closest('#addSlotBtn')){
    openModal(null);
  }
});

document.getElementById('filterBank').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if(!b) return;
  activeFilter = b.dataset.filter;
  renderFilterBank();
  render();
});

function openModal(site){
  editingId = site ? site.id : null;
  modalTitle.textContent = site ? 'Modifica modulo' : 'Nuovo modulo';
  document.getElementById('fName').value = site ? site.name : '';
  document.getElementById('fUrl').value = site ? site.url : '';
  renderCategoryOptions(site ? site.category : categories[0]);
  overlay.classList.add('open');
  document.getElementById('fName').focus();
}
function closeModal(){
  overlay.classList.remove('open');
  form.reset();
}

document.getElementById('openAdd').addEventListener('click', () => openModal(null));
document.getElementById('cancelAdd').addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  let url = document.getElementById('fUrl').value.trim();
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const name = document.getElementById('fName').value.trim();
  const category = document.getElementById('fCat').value;

  if(editingId){
    const s = sites.find(x => x.id === editingId);
    s.name = name; s.url = url; s.category = category;
  } else {
    sites.push({ id: 'site-' + Date.now(), name, url, category });
  }
  closeModal();
  render();
  await saveData();
});

/* gestione categorie */
function renderCatList(){
  const list = document.getElementById('catList');
  list.innerHTML = categories.map((c, i) => `
    <div class="cat-row">
      <input type="text" value="${escapeHtml(c)}" data-idx="${i}" class="catInput">
      <button class="icon-btn" data-action="delcat" data-idx="${i}" title="Elimina categoria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
    </div>
  `).join('');
}

document.getElementById('openCatManager').addEventListener('click', () => {
  renderCatList();
  catOverlay.classList.add('open');
});
document.getElementById('closeCatModal').addEventListener('click', () => catOverlay.classList.remove('open'));
catOverlay.addEventListener('click', (e) => { if(e.target === catOverlay) catOverlay.classList.remove('open'); });

// rinomina categoria
document.getElementById('catList').addEventListener('change', async (e) => {
  const input = e.target.closest('.catInput');
  if(!input) return;
  const idx = parseInt(input.dataset.idx, 10);
  const oldName = categories[idx];
  const newName = input.value.trim();
  if(!newName){ input.value = oldName; return; }
  if(newName === oldName) return;
  if(categories.includes(newName)){
    alert('Esiste già una categoria con questo nome.');
    input.value = oldName;
    return;
  }
  categories[idx] = newName;
  sites.forEach(s => { if(s.category === oldName) s.category = newName; });
  if(activeFilter === oldName) activeFilter = newName;
  renderFilterBank();
  render();
  await saveData();
});

// elimina categoria
document.getElementById('catList').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action="delcat"]');
  if(!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  const catName = categories[idx];
  if(categories.length <= 1){
    alert('Deve rimanere almeno una categoria.');
    return;
  }
  const inUse = sites.filter(s => s.category === catName).length;
  const fallback = categories.find(c => c !== catName);
  if(inUse > 0 && !confirm(`${inUse} sito/i in questa categoria verranno spostati su "${fallback}". Continuare?`)) return;
  sites.forEach(s => { if(s.category === catName) s.category = fallback; });
  categories.splice(idx, 1);
  if(activeFilter === catName) activeFilter = 'tutti';
  renderCatList();
  renderFilterBank();
  render();
  await saveData();
});

// aggiungi categoria
async function addCategory(){
  const input = document.getElementById('newCatName');
  const name = input.value.trim();
  if(!name) return;
  if(categories.includes(name)){
    alert('Categoria già esistente.');
    return;
  }
  categories.push(name);
  input.value = '';
  renderCatList();
  renderFilterBank();
  await saveData();
}
document.getElementById('addCatBtn').addEventListener('click', addCategory);
document.getElementById('newCatName').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); addCategory(); }
});

function tick(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleString('it-IT', { dateStyle:'medium', timeStyle:'short' });
}
tick();
setInterval(tick, 30000);

async function init(){
  grid.innerHTML = '<div class="empty-msg">Caricamento…</div>';
  await loadData();
  renderFilterBank();
  render();
}
init();
</script>
</body>
</html>
